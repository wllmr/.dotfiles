add_newline = true
format = "$directory$git_branch$git_status$nodejs$dotnet$cmd_duration$line_break$character"

[directory]
style = "bold blue"
truncation_length = 3

[git_branch]
symbol = " "
style = "bold purple"

[cmd_duration]
min_time = 1000
format = " [$duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
